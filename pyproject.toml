[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "whaledriver"
version = "0.1.0"
description = "An independent, unofficial Selenium integration for NAVER Whale."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "selenium>=4.25,<5",
    "websocket-client>=1.8,<2",
    "psutil>=5.9,<8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/whaledriver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: launches the installed Whale browser and may download ChromeDriver"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
