name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the selected Python interpreter
        run: uv python install
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check documentation formatting
        run: uv run mdformat --check README.md CONTRIBUTING.md THIRD_PARTY_NOTICES.md docs
      - name: Lint Python code
        run: uv run ruff check .
      - name: Run tests without a browser installation
        run: uv run pytest
      - name: Build the source distribution and wheel
        run: uv build
